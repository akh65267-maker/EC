name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure, no stored secrets
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build .NET solution
        run: dotnet build MyEc.slnx -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/Services.Tests -c Release --no-build

      # Testcontainers: real PostgreSQL, Redis, Azurite, Service Bus emulator (Docker is preinstalled on the runner)
      - name: Integration tests
        run: dotnet test tests/Services.IntegrationTests -c Release --no-build

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Secrets can't be used in a job-level `if`, so skip the remaining steps here until Azure is set up.
      - name: Check Azure configuration
        id: azure
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] && [ -n "$ALERT_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::Set AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID secrets and ALERT_EMAIL variable (see infra/README.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.azure.outputs.configured == 'true'

      - uses: azure/login@v2
        if: steps.azure.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Same script as local deploys: infra -> build images in ACR -> apps + APIM.
      - name: Deploy
        if: steps.azure.outputs.configured == 'true'
        shell: pwsh
        run: >
          ./infra/deploy.ps1
          -AlertEmail '${{ vars.ALERT_EMAIL }}'
          -Location '${{ vars.AZURE_LOCATION || 'eastus2' }}'
          -EnvironmentName '${{ vars.ENVIRONMENT_NAME || 'myec' }}'
